name: "The Settlers IV: Gold Edition"
game_slug: the-settlers-iv-gold-edition
version: GOG + widescreen and music fixes
slug: the-settlers-iv-gold-edition-gog-widescreen
runner: wine
gogid: 1207659254
description: >-
  Installs The Settlers IV: Gold Edition from the GOG offline installer, then
  applies the community widescreen fix at the resolution you choose, the
  music fix, and cnc-ddraw to stop the game using a whole CPU core. Based on
  the "GOG + Fix" Lutris script.
notes: >-
  If you are logged in to GOG in Lutris (Sources, GOG) and own the game, the
  offline installer is downloaded for you and checked against GOG's checksum.
  Otherwise you are asked to select the setup_*.exe you downloaded from GOG.
  The install runs silently, so there is nothing to click through. The
  widescreen fix replaces the game's 1024x768 option with the resolution you
  pick, so choose your screen's resolution (or the closest one below it) and
  leave the in-game resolution alone. The menu includes 3:2 sizes and exact
  integer fractions of two 3:2 panels. The game's left panel is a fixed
  picture about 1024 pixels tall, so on screens taller than that a smeared
  strip shows below it (the game does this at its own 1600x1200 too); sizes
  up to 1024 high, such as 1128x752 and 1440x960, don't show it. cnc-ddraw
  replaces GOG's ddraw.dll: the original game spins one CPU core at about
  100% waiting for each frame, and cnc-ddraw's frame limiter brings that down
  to about a third. Your original GfxEngine.dll, SoundTracks.cfg,
  GameSettings.cfg and ddraw.dll are kept next to the new ones with an .orig
  suffix. The resolution is applied by a script Lutris runs before each launch, so
  you can change it later by editing the S4_RESOLUTION environment variable under
  Configure, System options.

script:
  require-binaries: sha256sum, 7z

  variables:
    gamepath: drive_c/GOG Games/Settlers 4 Gold
    fix_sha256: 880d5cafeabebc314e0a098898d5e399158494b27158b4bb280cf11edb4b9063
    cncddraw_sha256: 0b13ab89a64c9918189b1dadd449ef6ed3cb3b7b19cabd96d8adbd95505bb908

  files:
  # Lutris swaps this first N/A file for a download from your GOG library when
  # you are logged in to GOG (the gogid above and "GOG" in the version select it).
  - gog_setup: "N/A:Select the Settlers IV Gold offline installer (setup_*.exe) downloaded from GOG"
  # Pinned to a commit, not master; the zip is also checked against fix_sha256.
  - fix: https://github.com/Armageddon91/Lutris-Script/raw/a35aa72684bbf0f5e5aa1d2463c0001e789dbea3/The%20Settlers%20IV/The%20Settler%204%20Fix.zip
  # cnc-ddraw v7.1.0.0 (MIT), a DirectDraw wrapper with a frame limiter
  - cncddraw: https://github.com/FunkyFr3sh/cnc-ddraw/releases/download/v7.1.0.0/cnc-ddraw.zip

  game:
    arch: win64
    exe: $GAMEDIR/$gamepath/S4.exe
    prefix: $GAMEDIR

  # Before each launch Lutris runs set-resolution.sh, which reads S4_RESOLUTION. To change
  # the resolution later, edit that variable in the game's Configure, System options.
  system:
    env:
      S4_RESOLUTION: $INPUT_RES
    prelaunch_command: '"$GAMEDIR/set-resolution.sh"'
    prelaunch_wait: true

  installer:
  - write_file:
      file: $CACHE/checkhash.sh
      content: |
        #!/bin/bash
        file="$1"; hash="$2"; echo "[INFO] Verifying $(basename "$file") sha256 checksum..."; if [ $(sha256sum "$file" | cut -c 1-64) = "$hash" ]; then echo "[INFO] ...checksum OK!"; else echo "[ERROR] ...checksum FAILED!"; exit 1; fi
  - execute:
      file: chmod
      args: +x $CACHE/checkhash.sh
  - execute:
      file: $CACHE/checkhash.sh
      args: fix $fix_sha256
  - execute:
      file: $CACHE/checkhash.sh
      args: cncddraw $cncddraw_sha256

  - task:
      name: create_prefix
      prefix: $GAMEDIR
      description: Creating the Wine prefix
  - task:
      name: wineexec
      prefix: $GAMEDIR
      executable: gog_setup
      args: /SP- /silent /nogui
      description: Installing the game, please wait...

  # Lutris runs this before every launch (see prelaunch_command below), so the resolution
  # can be changed later by editing S4_RESOLUTION in the game's environment variables.
  - write_file:
      file: $GAMEDIR/set-resolution.sh
      content: |
        #!/bin/bash
        # Sets the Settlers IV resolution before each launch. The size comes from the
        # S4_RESOLUTION environment variable as WIDTHxHEIGHT; change it in Lutris under
        # Configure, System options, Environment variables. The stock GfxEngine.dll keeps
        # the 1024x768 mode as two 16-bit numbers (bytes 67214 and 67219), rewritten here
        # from the saved original. This never fails the launch: if anything is wrong it
        # says so and leaves the DLL as it is.
        size="${S4_RESOLUTION:-}"
        exe="$(cd "$(dirname "$0")" && pwd)/$gamepath/Exe"
        orig="$exe/GfxEngine.dll.orig"
        dll="$exe/GfxEngine.dll"
        tmp="$dll.new"
        put16() { printf "$(printf '\\%03o\\%03o' $(($2 & 255)) $(($2 >> 8)))" | dd of="$tmp" bs=1 seek="$1" conv=notrunc 2>/dev/null; }
        w="${size%x*}"; h="${size#*x}"
        if [[ "$size" != *x* ]] || [[ ! "$w" =~ ^[0-9]{1,5}$ ]] || [[ ! "$h" =~ ^[0-9]{1,5}$ ]]; then
          echo "[set-resolution] S4_RESOLUTION='$size' is not WIDTHxHEIGHT; leaving the resolution as it is"; exit 0
        fi
        w=$((10#$w)); h=$((10#$h))
        if [ "$w" -lt 1 ] || [ "$w" -gt 65535 ] || [ "$h" -lt 1 ] || [ "$h" -gt 65535 ]; then
          echo "[set-resolution] $size is out of range (1 to 65535); leaving the resolution as it is"; exit 0
        fi
        if [ ! -f "$orig" ]; then
          echo "[set-resolution] $orig not found; leaving the resolution as it is"; exit 0
        fi
        if [ "$(od -An -tx1 -j 67214 -N 2 "$orig" | tr -d ' ')" != 0004 ] || [ "$(od -An -tx1 -j 67219 -N 2 "$orig" | tr -d ' ')" != 0003 ]; then
          echo "[set-resolution] GfxEngine.dll.orig is not the expected stock file; leaving the resolution as it is"; exit 0
        fi
        cp "$orig" "$tmp" && put16 67214 "$w" && put16 67219 "$h" || { rm -f "$tmp"; echo "[set-resolution] could not patch; leaving the resolution as it is"; exit 0; }
        if cmp -s "$tmp" "$dll"; then rm -f "$tmp"; else mv -f "$tmp" "$dll"; fi
        echo "[set-resolution] ${w}x${h}"

  - execute:
      command: 7z x -y -o"$CACHE/s4fix" "$fix" && 7z e -y -o"$CACHE/cncddraw" "$cncddraw" ddraw.dll ddraw.ini

  - input_menu:
      id: RES
      description: "Choose the widescreen resolution (it replaces the game's 1024x768 option). Sizes marked 'panel gap' are taller than 1024 pixels and show a smeared strip under the left panel, which the game does at its own 1600x1200 too:"
      preselect: 1920x1080
      options:
      - 1024x600: 1024x600
      - 1280x720: 1280x720
      - 1280x800: 1280x800
      - 1366x768: 1366x768
      - 1440x900: 1440x900
      - 1680x1050: 1680x1050 (panel gap)
      - 1920x1080: 1920x1080 (panel gap)
      - 1920x1200: 1920x1200 (panel gap)
      - 2560x1440: 2560x1440 (panel gap)
      - 2560x1600: 2560x1600 (panel gap)
      - 960x640: 960x640 (3:2, 1/3 of 2880x1920)
      - 1128x752: 1128x752 (3:2, 1/2 of 2256x1504)
      - 1440x960: 1440x960 (3:2, 1/2 of 2880x1920)
      - 1800x1200: 1800x1200 (3:2, panel gap)
      - 2256x1504: 2256x1504 (3:2, panel gap)
      - 2880x1920: 2880x1920 (3:2, panel gap)
      - 3840x2160: 3840x2160 (4K, panel gap)

  - execute:
      command: |
        set -e
        res="$INPUT"
        fixdir="$CACHE/s4fix/The Settler 4 Fix"
        game="$GAMEDIR/$gamepath"
        [ -f "$game/S4.exe" ] || { echo "[ERROR] S4.exe not found in $game, did the installer finish?"; exit 1; }
        # Keep the originals on the first run only, so a re-run never backs up fixed files
        if [ ! -f "$game/.fixes-applied" ]; then
          for f in Exe/GfxEngine.dll Exe/ddraw.dll Config/SoundTracks.cfg Config/GameSettings.cfg; do
            if [ -f "$game/$f" ]; then cp "$game/$f" "$game/$f.orig"; fi
          done
          touch "$game/.fixes-applied"
        fi
        # The widescreen fix: set-resolution.sh patches the saved stock GfxEngine.dll to the
        # chosen size (it also runs before every launch). Check it did, since it never fails.
        chmod +x "$GAMEDIR/set-resolution.sh"
        S4_RESOLUTION="$res" "$GAMEDIR/set-resolution.sh"
        rw=${res%x*}; rh=${res#*x}
        [ "$(od -An -tu2 -j 67214 -N 2 "$game/Exe/GfxEngine.dll" | tr -d ' ')" = "$rw" ] && [ "$(od -An -tu2 -j 67219 -N 2 "$game/Exe/GfxEngine.dll" | tr -d ' ')" = "$rh" ] || { echo "[ERROR] could not set the resolution to $res"; exit 1; }
        cp "$fixdir/Music Fix/SoundTracks.cfg" "$game/Config/SoundTracks.cfg"
        cp "$fixdir/Music Fix/Trojans_settle_03.mp3" "$game/Snd/Trojans_settle_03.mp3"
        # The fix's settings file with the chosen size as a starting value; the game
        # rewrites it on first run, and the DLL above is what sets the resolution
        cp "$fixdir/GameSettings.cfg" "$game/Config/GameSettings.cfg"
        sed -i -e "s/WindowWidth = .*/WindowWidth = ${res%x*}/" -e "s/WindowHeight = .*/WindowHeight = ${res#*x}/" "$game/Config/GameSettings.cfg"
        # cnc-ddraw replaces GOG's ddraw.dll. Its default frame limiter stops the game
        # spinning a core; singlecpu=true would pin the game to CPU0, so turn it off.
        cp "$CACHE/cncddraw/ddraw.dll" "$game/Exe/ddraw.dll"
        sed '0,/^singlecpu=true/s//singlecpu=false/' "$CACHE/cncddraw/ddraw.ini" > "$game/Exe/ddraw.ini"
        grep -q '^singlecpu=false' "$game/Exe/ddraw.ini" || { echo "[ERROR] ddraw.ini has no singlecpu setting"; exit 1; }
        echo "[INFO] Widescreen fix for $res, music fix and cnc-ddraw installed"
